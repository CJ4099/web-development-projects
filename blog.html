<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Stories Blog</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>

<header>
    <h1>Life Stories Blog</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#blog">Blog</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Share. Learn. Grow.</h2>
    <p>Real-life stories to inspire and improve lives.</p>
</section>

<section id="blog" class="blog">
    <h2>Latest Stories</h2>
    
    <div class="post" onclick="openPost('post1')">
        <h3>Overcoming Challenges</h3>
        <p>Click to read more...</p>
    </div>

    <div class="post" onclick="openPost('post2')">
        <h3>Learning French Journey</h3>
        <p>Click to read more...</p>
    </div>
</section>

<section id="post-view" class="post-view hidden">
    <button onclick="closePost()">⬅ Back</button>
    <h2 id="post-title"></h2>
    <p id="post-content"></p>
</section>

<section id="contact" class="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea placeholder="Your Message"></textarea>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>© 2026 Life Stories Blog</p>
</footer>

<script src="blog.js"></script>
</body>
</html>
